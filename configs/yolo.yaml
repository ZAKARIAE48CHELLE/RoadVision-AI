# RoadVision AI — YOLO Configuration
# Hardware: NVIDIA RTX 3070 8GB

model:
  family: "yolo"
  architecture: "yolov8s.pt"
  task: "detect"
  pretrained: true
  pretrained_weights: "yolov8s.pt"

training:
  imgsz: 640
  epochs: 50
  batch: 4
  device: 0
  workers: 4

  amp: true
  seed: 42
  deterministic: true
  cache: false

  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  patience: 15
  save: true
  save_period: 5
  close_mosaic: 10

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0

validation:
  conf: 0.001
  iou: 0.60
  save_json: false