# Configuration Modèle A : YOLO (Baseline & Fine-tuning)
model:
  family: "yolo"
  architecture: "yolov8s.pt" # ou yolov8n.pt pour configuration ultra-légère
  task: "detect"
  pretrained: true
  pretrained_weights: "yolov8s.pt"

training:
  imgsz: 640
  epochs: 50
  batch: 16
  device: "cpu" # basculer sur "0" lors de l'exécution sur GPU (Colab/Kaggle/Server)
  workers: 4
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  patience: 15
  save: true
  save_period: 5

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0

validation:
  conf: 0.25
  iou: 0.60
  save_json: true
