# RoadVision AI — RT-DETR Feasibility
# Hardware: NVIDIA RTX 3070 8GB

model:
  family: "rtdetr"
  architecture: "rtdetr-l.pt"
  task: "detect"
  pretrained: true
  pretrained_weights: "rtdetr-l.pt"

training:
  imgsz: 416
  epochs: 2
  batch: 1
  device: 0
  workers: 2

  amp: true
  seed: 42
  deterministic: false
  cache: false

  freeze: 10

  optimizer: "AdamW"
  lr0: 0.0001
  weight_decay: 0.0001

  patience: 15
  save: true
  save_period: -1

validation:
  conf: 0.001
  iou: 0.60
  save_json: false